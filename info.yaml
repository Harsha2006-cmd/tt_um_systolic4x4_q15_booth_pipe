--- 
# Tiny Tapeout project information
project:
  wokwi_id:    0        # If using wokwi, set this to your project's ID

# Tiny Tapeout project information
project:
  title:       "4x4 Q15 Systolic Matrix Multiplier (Pipelined Booth)"  # Project title
  author:      "H S Harsha"        # Your name
  description: "Byte-serial 4x4 signed Q15/INT16 matrix multiplier using a 16-PE systolic array with pipelined radix-4 Booth multipliers"
  language:    "Verilog"
  clock_hz:    238000000                # confirm against your actual verified target frequency

  # A 16-PE systolic array with pipelined Booth multipliers is NOT small.
  # Run synthesis first and check utilization before trusting 1x1 -- bump
  # to 1x2 / 2x2 if density can't be met.
  tiles: "1x1"

  # Must start with tt_um_ and be unique (include your github username)
  top_module: "tt_um_YOURUSERNAME_systolic4x4_q15_booth_pipe"

  # Must be in ./src -- and ALSO listed in test/Makefile's PROJECT_SOURCES
  source_files:
    - "tt_um_systolic4x4_q15_booth_pipe.v"
    - "systolic_array4x4_booth4_pipe.v"
    - "systolic_array4x4_1_booth4_pipe.v"
    - "pe_q15_booth4_pipe.v"
    - "radix4_booth_mult16_pipe.v"
    - "matrix_loader4x4.v"
    - "skew_delay.v"

  # Pinout -- shown on the datasheet/website. Leave unused pins blank,
  # do not add/remove any pins.
  pinout:
    # Inputs -- ui_in[7:0] is a single 8-bit data bus (byte-serial load
    # of A/B), not 8 independent signals. Label every bit so the
    # datasheet doesn't imply 7 of 8 pins are unused.
    ui[0]: "DATA_IN[0] -- data byte bit 0 (load phase)"
    ui[1]: "DATA_IN[1] -- data byte bit 1 (load phase)"
    ui[2]: "DATA_IN[2] -- data byte bit 2 (load phase)"
    ui[3]: "DATA_IN[3] -- data byte bit 3 (load phase)"
    ui[4]: "DATA_IN[4] -- data byte bit 4 (load phase)"
    ui[5]: "DATA_IN[5] -- data byte bit 5 (load phase)"
    ui[6]: "DATA_IN[6] -- data byte bit 6 (load phase)"
    ui[7]: "DATA_IN[7] -- data byte bit 7 (load phase, MSB)"

    # Outputs -- uo_out[7:0] is likewise a single 8-bit data bus
    # (byte-serial read of C), all 8 bits used.
    uo[0]: "DATA_OUT[0] -- data byte bit 0 (read phase)"
    uo[1]: "DATA_OUT[1] -- data byte bit 1 (read phase)"
    uo[2]: "DATA_OUT[2] -- data byte bit 2 (read phase)"
    uo[3]: "DATA_OUT[3] -- data byte bit 3 (read phase)"
    uo[4]: "DATA_OUT[4] -- data byte bit 4 (read phase)"
    uo[5]: "DATA_OUT[5] -- data byte bit 5 (read phase)"
    uo[6]: "DATA_OUT[6] -- data byte bit 6 (read phase)"
    uo[7]: "DATA_OUT[7] -- data byte bit 7 (read phase, MSB)"

    # Bidirectional pins -- these ARE 8 independent single-bit signals
    # (1 strobe input + 7 status outputs), correctly labeled individually.
    uio[0]: "strobe (1 cycle pulse): consume/advance one byte"
    uio[1]: "busy"
    uio[2]: "done_pulse (1 cycle)"
    uio[3]: "load_a_phase"
    uio[4]: "load_b_phase"
    uio[5]: "compute_phase"
    uio[6]: "read_phase"
    uio[7]: "byte_valid (uo_out holds a valid C byte this cycle)"

# Do not change!
yaml_version: 6
