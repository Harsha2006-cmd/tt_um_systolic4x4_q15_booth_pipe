name: wokwi_test

on:
  push:
  workflow_dispatch:

jobs:
  wokwi_test:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout your project
      # ---------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------------------------------------------------------
      # 2. Install OSS CAD Suite
      #    Provides Yosys, Icarus Verilog, cocotb, etc.
      # ---------------------------------------------------------
      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v2
        with:
          python-override: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 3. Verify HDL tools
      # ---------------------------------------------------------
      - name: Check HDL tools
        run: |
          echo "================================"
          echo "Yosys"
          echo "================================"
          yosys --version

          echo "================================"
          echo "Icarus Verilog"
          echo "================================"
          iverilog -V

          echo "================================"
          echo "Cocotb"
          echo "================================"
          cocotb-config --version
          cocotb-config --python-bin
          cocotb-config --libpython

      # ---------------------------------------------------------
      # 4. Download Tiny Tapeout support tools
      # ---------------------------------------------------------
      - name: Checkout Tiny Tapeout tools
        uses: actions/checkout@v4
        with:
          repository: TinyTapeout/tt-support-tools
          path: tt
          ref: main

      # ---------------------------------------------------------
      # 5. Python 3.11
      #
      # IMPORTANT:
      # The old workflow used Python 3.10.
      # Your previous error showed contourpy 1.3.3
      # requires Python >= 3.11.
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------------------------------------------------------
      # 6. Verify Python
      # ---------------------------------------------------------
      - name: Check Python
        run: |
          python --version
          python -m pip --version

      # ---------------------------------------------------------
      # 7. Install Tiny Tapeout requirements
      # ---------------------------------------------------------
      - name: Install Tiny Tapeout requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tt/requirements.txt

      # ---------------------------------------------------------
      # 8. Generate/check Tiny Tapeout configuration
      # ---------------------------------------------------------
      - name: Create Tiny Tapeout user config
        run: |
          ./tt/tt_tool.py --create-user-config

      # ---------------------------------------------------------
      # 9. Display project structure
      # ---------------------------------------------------------
      - name: Check project structure
        run: |
          echo "=============================="
          echo "SRC FILES"
          echo "=============================="
          find src -maxdepth 1 -type f -print | sort

          echo "=============================="
          echo "TEST FILES"
          echo "=============================="
          find test -maxdepth 2 -type f -print | sort

          echo "=============================="
          echo "INFO.YAML"
          echo "=============================="
          cat info.yaml

      # ---------------------------------------------------------
      # 10. Run the actual cocotb/Verilog test
      # ---------------------------------------------------------
      - name: Run Verilog test
        working-directory: test
        run: |
          make clean || true
          make

      # ---------------------------------------------------------
      # 11. Upload VCD/FST waveform
      # ---------------------------------------------------------
      - name: Upload simulation waveforms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-waveforms
          path: |
            test/*.vcd
            test/*.fst
            test/*.gtkw
          if-no-files-found: warn

      # ---------------------------------------------------------
      # 12. Upload test results/logs
      # ---------------------------------------------------------
      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: |
            test/results.xml
            test/*.log
            test/sim_build/
          if-no-files-found: warn
